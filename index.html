<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMART TERMINAL HR</title>
<meta name="description" content="HR Application — บริษัท สมาร์ทเทอร์มินอล คอร์ปอเรชั่น จำกัด">
<meta name="theme-color" content="#0a3489">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/Kanit-Regular.woff" as="font" type="font/woff" crossorigin>
<style>@font-face{font-family:'Kanit';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/Kanit-Light.woff') format('woff')}
@font-face{font-family:'Kanit';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/Kanit-Regular.woff') format('woff')}
@font-face{font-family:'Kanit';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/Kanit-Medium.woff') format('woff')}
@font-face{font-family:'Kanit';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/Kanit-SemiBold.woff') format('woff')}
@font-face{font-family:'Kanit';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/Kanit-Bold.woff') format('woff')}
:root{
  --brand:#0b56c4;--brand-2:#1f7cf2;--brand-3:#e8f1ff;--navy:#08245c;--navy-2:#0c3a8a;--accent:#f39a2e;
  --bg:#f2f5fa;--panel:#ffffff;--panel-2:#f7f9fc;--ink:#0f1d33;--ink-2:#4a5873;--ink-3:#8190a8;--line:#e2e8f2;
  --good:#15803d;--good-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#c62828;--bad-bg:#fee2e2;--info:#0b56c4;--info-bg:#e0edff;
  --r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(15,29,51,.06),0 6px 20px rgba(15,29,51,.06);
  --f:'Kanit','Sukhumvit Set','Leelawadee UI','Noto Sans Thai',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --sbw:264px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --brand:#4d8ff5;--brand-2:#6aa6ff;--brand-3:#15284a;--bg:#0a1120;--panel:#111a2c;--panel-2:#0f1727;--ink:#e6edf8;--ink-2:#a8b5cc;--ink-3:#6f7f99;--line:#22304a;
  --good:#4ade80;--good-bg:#0f2e1c;--warn:#fbbf24;--warn-bg:#33270b;--bad:#f87171;--bad-bg:#3a1414;--info:#7fb0ff;--info-bg:#132544;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme=dark]{
  --brand:#4d8ff5;--brand-2:#6aa6ff;--brand-3:#15284a;--bg:#0a1120;--panel:#111a2c;--panel-2:#0f1727;--ink:#e6edf8;--ink-2:#a8b5cc;--ink-3:#6f7f99;--line:#22304a;
  --good:#4ade80;--good-bg:#0f2e1c;--warn:#fbbf24;--warn-bg:#33270b;--bad:#f87171;--bad-bg:#3a1414;--info:#7fb0ff;--info-bg:#132544;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--ink-2)}.small{font-size:13px}.tiny{font-size:12px}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1 1 auto}.right{margin-left:auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2{grid-template-columns:1fr}}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;min-height:38px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brand-2)}
.btn.pri{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.good{background:var(--good);border-color:transparent;color:#fff}.btn.bad{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--brand-3)}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13.5px}.btn.icon{padding:0;width:38px;justify-content:center}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:9px 12px;min-height:40px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 18%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.req::after{content:" *";color:var(--bad)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .sub{margin-top:-6px;margin-bottom:10px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px;color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.b-good{background:var(--good-bg);color:var(--good);border-color:transparent}.b-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.b-bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.b-info{background:var(--info-bg);color:var(--info);border-color:transparent}
.pending-flag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 7px}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:10px 12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;margin-bottom:12px}
.notice.info{background:var(--info-bg);color:var(--info)}.notice.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:34px 12px;text-align:center;color:var(--ink-3)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:6px}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--brand-3)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .acts{white-space:nowrap;text-align:right}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:none;border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--panel);color:var(--brand);box-shadow:var(--shadow)}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:24px 16px;color:#fff;
  background:radial-gradient(1200px 600px at 80% -10%,#3b82f6 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1d4ed8 0,transparent 55%),linear-gradient(160deg,#0a3a8c,#06215a 60%,#041638)}
.login{position:relative;isolation:isolate;overflow:hidden}
.login-in{width:100%;max-width:440px;min-width:0;position:relative;z-index:1}
.lbg{position:absolute;inset:0;z-index:0;pointer-events:none;background:#0a3a8e url(login-bg.jpg) center top/cover no-repeat}
.lwave{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(70px,14vh,140px);display:none}
.lbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,80,.15),rgba(6,30,80,0) 30%,rgba(6,30,80,.1) 100%)}
@media (min-aspect-ratio:3/4){.lbg{background-position:center 28%}.lwave{display:block}}
.lfoot div{min-width:0}.lfoot{gap:0}
.brandline{display:flex;align-items:center;gap:16px}
.brandline img,.brandline .logo-fb{width:72px;height:72px;object-fit:contain}
.brandline .sep{width:1.5px;height:56px;background:rgba(255,255,255,.55)}
.brandline .t1{font-size:21px;font-weight:600;letter-spacing:.5px;line-height:1.15}
.brandline .t2{font-size:13px;opacity:.85}
.login h1{font-size:54px;line-height:1.02;margin:34px 0 12px;font-weight:700;letter-spacing:-1px}
.login .bar{width:90px;height:6px;border-radius:9px;background:linear-gradient(90deg,#22d3ee,#3b82f6)}
.login .tag{opacity:.9;margin:14px 0 26px;font-size:17px}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:24px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:24px}
.lfield{display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);border-radius:14px;padding:0 14px;margin-bottom:14px}
.lfield input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;padding:14px 0;font-size:17px}
.lfield input::placeholder{color:rgba(255,255,255,.8)}
.lfield button{background:none;border:none;color:#fff;cursor:pointer;padding:6px;display:grid}
.lbtn{width:100%;border:none;border-radius:14px;padding:14px;font-size:19px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(180deg,#1e5fe0,#0a3aa8);box-shadow:0 8px 24px rgba(10,58,168,.45)}
.lbtn[disabled]{opacity:.6}
.lerr{background:rgba(220,38,38,.25);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.lfoot{display:flex;justify-content:space-around;margin-top:28px;text-align:center;font-size:14px;opacity:.95}
.lfoot div{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.lfoot div+div{border-left:1px solid rgba(255,255,255,.3)}
.lfoot svg{width:34px;height:34px;stroke-width:1.5}
.linkbtn{background:none;border:none;color:#fff;text-decoration:underline;cursor:pointer;font-size:15px;margin-top:14px;width:100%}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100dvh}
@media (min-width:1000px), (min-width:700px) and (min-height:500px){.shell{background:linear-gradient(90deg,#061a45 var(--sbw),transparent var(--sbw))}}
.sb{width:var(--sbw);flex:none;background:linear-gradient(180deg,var(--navy),#061a45);color:#dbe6ff;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column}
.sb .brandline{padding:18px 16px 14px;gap:12px}
.sb .brandline img,.sb .brandline .logo-fb{width:44px;height:44px}
.sb .brandline .sep{height:36px;width:1px}
.sb .brandline .t1{font-size:15px}.sb .brandline .t2{font-size:11px;line-height:1.3}
.sb nav{flex:1;overflow:auto;padding:6px 10px}
.sb a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#c7d6f5;font-weight:500;margin-bottom:2px}
.sb a.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.sb a.nav.on{background:linear-gradient(90deg,rgba(59,130,246,.45),rgba(59,130,246,.12));color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.sb a.nav .cnt{margin-left:auto;background:var(--accent);color:#1b1206;font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px}
.sb .me{border-top:1px solid rgba(255,255,255,.1);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb .me .n{font-size:13.5px;font-weight:500;color:#fff;line-height:1.2}.sb .me .p{font-size:11.5px;opacity:.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 22px;min-height:62px}
.crumb{font-size:13px;color:var(--ink-3)}.crumb b{color:var(--ink);font-weight:600;font-size:17px;display:block}
.search{position:relative;max-width:340px;flex:1}
.search input{padding-left:38px;border-radius:999px;background:var(--panel)}
.search svg{position:absolute;left:12px;top:10px;color:var(--ink-3)}
.search .res{position:absolute;top:44px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:40}
.search .res a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--ink)}.search .res a:hover{background:var(--brand-3)}
.bell{position:relative}
.bell .dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.content{padding:20px 22px 40px;width:100%;max-width:1400px}
.pagehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h2{margin:0;font-size:22px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;text-align:center;line-height:1;object-fit:cover;background:linear-gradient(135deg,#60a5fa,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;overflow:hidden}
.avatar.lg{width:96px;height:96px;font-size:34px;border:4px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.avatar{position:relative}.avatar img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:50%}
.crop{position:relative;width:260px;height:260px;margin:4px auto 12px;border-radius:50%;overflow:hidden;background:#0b1830;touch-action:none;cursor:grab;box-shadow:0 0 0 3px var(--brand)}.crop img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.agent{display:flex;gap:12px;align-items:flex-start}.agent .ab{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,#6366f1,#2563eb)}.agent .ab svg{width:24px;height:24px}
.agent.good .ab{background:linear-gradient(135deg,#34d399,#0f9f6e)}.agent.warn .ab{background:linear-gradient(135deg,#fb923c,#dc2626)}
.agent h4{margin:0 0 2px;font-size:16px}.agent .ad{font-size:14px;color:var(--ink-2)}.lstat{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.lstat span{background:var(--panel-2);border-radius:10px;padding:6px 10px;font-size:13px}.lstat b{font-size:15px}
.anlist .an{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:inherit}.anlist .an:first-child{border-top:0}.anlist .an .mi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--brand-3);color:var(--brand)}
.chatbox{display:flex;flex-direction:column;gap:10px;min-height:50vh}.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-line}.msg.bot{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}.msg.me{background:var(--brand);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chips2 button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;padding:7px 12px;font:inherit;font-size:14px}
.chatin{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg,transparent);padding:8px 0}.chatin input{flex:1}
.bnav{display:none}
.mtop{display:none}

/* ---------- home hero ---------- */
.hero{border-radius:22px;color:#fff;padding:22px;position:relative;overflow:hidden;margin-bottom:18px;
  background:radial-gradient(700px 300px at 85% 0,rgba(96,165,250,.55),transparent 60%),linear-gradient(135deg,#0b4fc0,#0a3489 55%,#082766)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
.hero .hi{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.hero .hello{opacity:.9;font-size:15px}.hero .code{font-size:24px;font-weight:600;line-height:1.25}
.hero .nm{font-size:19px;font-weight:500}.hero .pos{opacity:.85;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0 0;position:relative;z-index:1}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:18px;color:#fff;text-align:center;font-weight:500;font-size:14px;line-height:1.25;min-height:112px;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);transition:transform .12s}
.tile:hover{transform:translateY(-2px);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12))}
.tile .ti{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tile .ti svg{width:28px;height:28px;stroke:#fff;stroke-width:1.9}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.today>div{border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;background:var(--panel-2)}
.today .l{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:4px}
.today .v{font-size:22px;font-weight:600;margin-top:2px}
.svc{border-radius:18px;padding:20px 22px;color:#fff;background:linear-gradient(110deg,#0a3aa8,#1e6ef0);display:flex;align-items:center;gap:16px;margin-top:16px}
.svc b{font-size:22px;display:block}.svc .chips{margin-left:auto;display:flex;gap:10px}
.svc .chips span{width:56px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4)}

/* ---------- bars ---------- */
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 44px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(5,14,32,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:620px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:960px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px;font-weight:600;flex:1}
.modal .mb{padding:16px 18px;overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:#0f1d33;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fi .2s}
.toast.bad{background:#b91c1c}.toast.good{background:#15803d}
.drop{position:absolute;right:0;top:46px;width:360px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:50;max-height:70dvh;display:flex;flex-direction:column}
.drop .it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.drop .it.unread{background:var(--brand-3)}
.drop .it:hover{background:var(--panel-2)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- timeline / calendar ---------- */
.tl{position:relative;padding-left:22px}
.tl>div{position:relative;padding:0 0 14px}
.tl>div::before{content:"";position:absolute;left:-17px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--ink-3)}
.tl>div.ok::before{background:var(--good);box-shadow:0 0 0 1.5px var(--good)}.tl>div.no::before{background:var(--bad);box-shadow:0 0 0 1.5px var(--bad)}
.tl>div.cur::before{background:var(--warn);box-shadow:0 0 0 1.5px var(--warn)}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:14px;width:1.5px;background:var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--ink-3);text-align:center;font-weight:600}
.cal .d{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:var(--panel);font-size:12px;display:flex;flex-direction:column;gap:2px}
.cal .d.off{background:var(--panel-2)}.cal .d.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .d b{font-size:13px}
.st-PRESENT{color:var(--good)}.st-LATE,.st-INCOMPLETE,.st-IN{color:var(--warn)}.st-ABSENT{color:var(--bad)}.st-LEAVE{color:var(--info)}
.org-tree ul{list-style:none;padding-left:22px;margin:0;border-left:1.5px dashed var(--line)}
.org-tree>ul{border:none;padding-left:0}
.org-tree li{margin:6px 0}
.org-node{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px 7px 8px}
.org-node .p{font-size:12px;color:var(--ink-3)}
.org-toggle{border:none;background:none;cursor:pointer;color:var(--ink-3);width:22px}
.payslip{max-width:760px;margin:0 auto;background:#fff;color:#111;padding:28px;border-radius:12px;border:1px solid var(--line)}
.payslip table{width:100%;border-collapse:collapse;font-size:14px}.payslip td{padding:4px 6px}
.payslip .hd{display:flex;gap:14px;align-items:center;border-bottom:2px solid #0b56c4;padding-bottom:12px;margin-bottom:12px}
.payslip .hd img{width:56px;height:56px;object-fit:contain}
.payslip .tot td{border-top:1px solid #ccc;font-weight:600}

/* ===================== v1.1 mockup components ===================== */

.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kcard{position:relative;overflow:hidden;display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:0 3px 12px rgba(15,35,71,.07)}
.kic{width:60px;height:60px;border-radius:50%;background:#132c5e;color:#fff;display:grid;place-items:center;flex:none}
.kic svg{width:30px;height:30px}
.kb{position:relative;z-index:1;min-width:0}
.kl{font-size:16px;color:var(--ink);font-weight:500}
.kv{font-size:34px;font-weight:700;color:var(--brand);line-height:1.2;margin:2px 0}
.kv small{font-size:21px;font-weight:600}
.kd{font-size:13.5px;font-weight:600}.kd span{color:var(--ink-2);font-weight:400}
.kd.up{color:#15803d}.kd.down{color:#dc2626}.kd.neu{color:var(--ink-2)}
.kwm{position:absolute;right:16px;top:44px;color:var(--line);opacity:.9}
.kwm svg{width:58px;height:58px;stroke-width:1.4}
.dgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1.1fr) minmax(0,.95fr);gap:16px;margin-top:18px}
.dgrid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(15,35,71,.07);display:flex;flex-direction:column}
.panel.wide{margin-top:18px}
.panel>header{display:flex;align-items:center;gap:12px;background:#132c5e;color:#fff;padding:11px 18px;min-height:52px}
.panel>header svg{width:24px;height:24px}
.panel>header h3{margin:0;font-size:18px;font-weight:600}
.panel .pb{padding:14px 18px;flex:1}
.gseg{display:inline-flex;background:#fff;border-radius:999px;padding:3px}
.gseg button{border:none;background:none;border-radius:999px;padding:5px 13px;font-size:13.5px;color:#13213c;cursor:pointer}
.gseg button.on{background:linear-gradient(90deg,#cf9d5f,#a9742f);color:#fff}
.lgnd{display:flex;justify-content:center;gap:22px;font-size:13px;color:var(--ink-2)}
.lgnd i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bchart{width:100%;height:auto;max-height:290px;display:block;margin:0 auto}
.bchart .gl{stroke:var(--line);stroke-width:1}.bchart .ax{fill:var(--ink-2);font-size:12px}
.bchart .vl{fill:var(--ink);font-size:13px;font-weight:600}.bchart .xl{fill:var(--ink);font-size:13px}
.bchart text{font-family:var(--f)}
.dwrap{display:flex;align-items:center;gap:16px;justify-content:center;min-height:240px}
.donut{width:180px;height:180px;flex:none}
.donut .dn{font-size:24px;font-weight:700;fill:var(--brand);font-family:var(--f)}.donut .ds{font-size:10px;fill:var(--ink-2);font-family:var(--f)}
.dleg{display:flex;flex-direction:column;gap:10px}
.dleg>div{display:flex;gap:10px;align-items:flex-start}
.dleg i{width:15px;height:15px;border-radius:50%;flex:none;margin-top:3px}
.dleg b{display:block;font-size:14.5px;font-weight:500}.dleg span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3}
.blist .brow{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:16px}
.blist .brow:last-child{border-bottom:none}
.bic{width:42px;height:42px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.blist .brow b{font-size:21px;color:var(--brand)}.blist .brow b small{font-size:15px}
.panel .btn.gold.full{margin-top:12px;min-height:46px;border-radius:12px;font-size:16px}
.atbl{width:100%;border-collapse:collapse;font-size:14.5px}
.atbl th{background:var(--panel-2);text-align:left;font-weight:600;padding:10px 18px;border-bottom:1px solid var(--line)}
.atbl td{padding:9px 18px;border-bottom:1px solid var(--line)}
.panel.wide .pb{padding:0}
.pillbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#13213c;border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
.pillbtn svg{width:16px;height:16px}
@media (max-width:1560px){.dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dgrid>.panel:first-child{grid-column:1/-1}.kwm{opacity:.55}.kwm svg{width:46px;height:46px}.kl{font-size:15px}.kv{font-size:30px}}
.panel>header h3,.gseg button{white-space:nowrap}

/* ===================== TABLET (v1.3) — 700–1199px: แถบเมนูแบบไอคอน + แดชบอร์ดกราฟ ===================== */
@media (min-width:700px) and (max-width:1199px) and (min-height:500px){
  :root{--sbw:100px}
  .sblogo{padding:16px 6px 10px;gap:4px}
  .sblogo img,.sblogo .logo-fb{width:52px;height:52px}
  .sblogo span{font-size:10.5px;letter-spacing:1.2px}
  .sb nav{padding:4px 8px;scrollbar-width:none}
  .sb nav::-webkit-scrollbar{display:none}
  .sb a.nav{position:relative;flex-direction:column;justify-content:center;gap:4px;padding:9px 2px 8px;font-size:11.5px;line-height:1.2;text-align:center;border-radius:12px;margin-bottom:4px;min-height:60px}
  .sb a.nav span:not(.cnt){display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb a.nav svg{width:24px;height:24px}
  .sb a.nav .cnt{position:absolute;top:5px;right:12px;margin:0;font-size:10px;padding:0 5px;min-width:17px}
  .sb a.nav.on{box-shadow:0 3px 10px rgba(169,116,47,.35)}
  .sbver{font-size:10.5px;padding:8px 6px 12px;text-align:center}
  .sb::after{display:none}
  .top{min-height:68px;padding:10px 20px;gap:12px}
  .ttl b{font-size:20px}.ttl>span{font-size:13.5px}
  .search{max-width:220px}
  .content{padding:18px 20px 36px}
  .btn,.inp,select.inp{min-height:42px}
  .tab{padding-top:11px;padding-bottom:11px}
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .kcard{padding:18px 16px;gap:14px}
  .kic{width:52px;height:52px}.kic svg{width:26px;height:26px}
  .kv{font-size:28px}.kl{font-size:15px}
  .kwm{display:none}
  .dgrid,.dgrid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
  .dgrid>.panel:first-child{grid-column:1/-1}
  .tblwrap,.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
/* แท็บเล็ตแนวตั้ง / จอแคบ */
@media (min-width:700px) and (max-width:999px) and (min-height:500px){
  .tdate{display:none}
  .search{max-width:180px}
  .ttl b{font-size:18px}.ttl>span{font-size:12.5px}
  .dgrid,.dgrid2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal.wide{width:calc(100vw - 32px)}
}
/* ตัวอย่างมุมมองอุปกรณ์ */
.vpbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.vpstage{display:grid;place-items:start center;background:repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 10px,var(--bg) 10px,var(--bg) 20px);border-radius:14px;padding:14px;overflow:hidden}
.vpdev{position:relative;background:#0b1220;border-radius:34px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.35);transform-origin:top center}
.vpdev.tab{border-radius:26px;padding:16px}
.vpdev iframe{display:block;border:0;border-radius:24px;background:#fff}
.vpdev.tab iframe{border-radius:12px}
.modal.vpm{width:min(1280px,calc(100vw - 24px));max-width:none}
/* แท็บเล็ตแนวนอน */
@media (min-width:1000px) and (max-width:1199px) and (min-height:500px){.kgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.kcard{flex-direction:column;gap:10px}}
@media (min-width:700px) and (max-width:1199px) and (min-height:500px) and (max-height:899px){.sbver{display:none}}
/* มือถือแนวนอน: แถบล่างกะทัดรัด */
@media (max-width:999px) and (max-height:499px){
  .bnav{padding:3px 4px calc(3px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
  .bnav a{flex-direction:row;justify-content:center;gap:6px;padding:6px 0}
  .bnav a svg{width:21px;height:21px}
  .content{padding-bottom:70px}
}

/* โครงสร้างหน่วยงาน */
.os-top{display:flex;justify-content:center;margin:6px 0 14px}

function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/duplicate key.*employee_code/i.test(m)) return 'รหัสพนักงานซ้ำ';
  if (/duplicate key/i.test(m)) return 'ข้อมูลซ้ำกับที่มีอยู่แล้ว';
  if (/row-level security|permission denied/i.test(m)) return 'ไม่มีสิทธิ์ดำเนินการนี้';
  if (/no_overlap_assignment|conflicting key/i.test(m)) return 'ช่วงเวลาการมอบหมายงานซ้อนกับรายการเดิม';
  if (/violates foreign key/i.test(m)) return 'ไม่สามารถลบได้ เนื่องจากมีข้อมูลอ้างอิงอยู่';
  if (/Failed to fetch|NetworkError|Network request failed/i.test(m)) return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบอินเทอร์เน็ต';
  return m;
}

/* field: {k,label,type,req,opts:[[v,l]],full,ph,hint,min,max,step,ro} */
function fieldHtml(f, v) {

  const cls = `f ${f.full ? 'full' : ''} ${f.req ? 'req' : ''}`;
  const hint = f.hint ? `<span class="tiny muted">${f.hint}</span>` : '';

  if (f.type === 'check') return `<label class="chk ${f.full ? 'full' : ''}"><input type="checkbox" id="${id}" ${val === true || val === 'true' ? 'checked' : ''} ${f.ro ? 'disabled' : ''}> ${esc(f.label)}</label>`;
  if (f.type === 'checks') { const arr = (val || []).map(String); return `<div class="${cls}"><span class="f">${esc(f.label)}</span><div class="row" id="${id}">${f.opts.map(([o, l]) => `<label class="chk"><input type="checkbox" value="${esc(o)}" ${arr.includes(String(o)) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>${hint}</div>`; }

  if (f.type === 'emp') return `<label class="${cls}">${esc(f.label)}<input class="inp" id="${id}" list="dl_${id}" value="${esc(val ? empOpt(val) : '')}" placeholder="พิมพ์รหัสหรือชื่อ" autocomplete="off" ${f.ro ? 'disabled' : ''}><datalist id="dl_${id}">${S.dir.filter(e => !f.activeOnly || ['ACTIVE', 'PROBATION'].includes(e.employee_status)).map(e => `<option value="${esc(empOpt(e.id))}">`).join('')}</datalist>${hint}</label>`;
  if (f.type === 'textarea') return `<label class="${cls}">${esc(f.label)}<textarea class="inp" id="${id}" placeholder="${esc(f.ph || '')}" ${f.ro ? 'readonly' : ''}>${esc(val)}</textarea>${hint}</label>`;
  if (f.type === 'file') return `<label class="${cls}">${esc(f.label)}<input class="inp" type="file" id="${id}" ${f.accept ? `accept="${f.accept}"` : ''} ${f.multiple ? 'multiple' : ''}>${hint}</label>`;
  return `<label class="${cls}">${esc(f.label)}${f.list ? `<datalist id="dl_${id}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}<input class="inp" id="${id}" ${f.list ? `list="dl_${id}"` : ''} type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.ph || '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step ? `step="${f.step}"` : ''} ${f.ro ? 'readonly' : ''}>${hint}</label>`;
}
const empOpt = id => { const e = S.dirMap[id] || (S.ctx && S.ctx.employee.id === id ? S.ctx.employee : null); return e ? `${e.employee_code} · ${e.first_name} ${e.last_name || ''}`.trim() : ''; };

function readFields(root, fields) {
  const o = {};
  for (const f of fields) {
    if (f.type === 'section') continue;
    const el = $('#f_' + f.k, root); if (!el) continue;
    let v;
    if (f.type === 'check') v = el.checked;
    else if (f.type === 'checks') v = $$('input:checked', el).map(x => f.numeric ? Number(x.value) : x.value);
    else if (f.type === 'file') v = el.files;
    else if (f.type === 'emp') { v = empFromOpt(el.value.trim()); if (v === undefined) throw new Error(`${f.label}: ไม่พบพนักงานที่เลือก`); }
    else if (f.type === 'number') v = el.value === '' ? null : Number(el.value);
    else v = el.value.trim() === '' ? null : el.value.trim();
    if (f.req && (v == null || v === '' || (Array.isArray(v) && !v.length) || (f.type === 'file' && !v.length))) throw new Error(`กรุณาระบุ ${f.label}`);
    o[f.k] = v;
  }
  return o;
}
function formModal({ title, fields, values = {}, okText = 'บันทึก', wide = false, intro = '', onSubmit, extraBtn }) {

      foot: `${extraBtn ? extraBtn.html : ''}<span class="grow"></span><button class="btn" data-c>ยกเลิก</button><button class="btn pri" data-ok>${esc(okText)}</button>`, onClose: () => res(null) });
    $('[data-c]', m.el).onclick = () => m.close();
    if (extraBtn) $('[data-extra]', m.el).onclick = () => extraBtn.fn(m);
    const ok = $('[data-ok]', m.el);
    ok.onclick = async () => {
      let v; try { v = readFields(m.el, fields); } catch (e) { toast(e.message, 'bad'); return; }
      ok.disabled = true;
      try { const r = onSubmit ? await onSubmit(v, m) : v; if (r === false) { ok.disabled = false; return; } m.el.remove(); res(r ?? v); }
      catch (e) { console.error(e); toast(errMsg(e), 'bad'); ok.disabled = false; }
    };
    m.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') { e.preventDefault(); ok.click(); } });
    const first = $('input:not([type=checkbox]),select,textarea', m.el); first && setTimeout(() => first.focus(), 30);
  });
}

/* ===================== BOOT ===================== */
async function boot() {
  document.body.innerHTML = '<div class="spin" style="margin-top:30vh"></div>';
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) {
    try { const co = await q(sb.from('companies').select('company_name,logo_path').limit(1)); S.company = co[0] || {}; } catch (e) { S.company = {}; }
    return renderLogin();
  }
  try {
    S.ctx = await rpc('my_context');
    if (!S.ctx || S.ctx.error) { await sb.auth.signOut(); return renderLogin('บัญชีนี้ยังไม่ผูกกับข้อมูลพนักงาน กรุณาติดต่อ HR'); }
    await Promise.all([loadLookups(), loadDir()]);
    await signPhotos([...S.dir, me()]);
  } catch (e) { console.error(e); return renderLogin(errMsg(e)); }
  renderShell();
  const um = data.session.user?.user_metadata || {};
  if (um.must_change_password) setTimeout(() => weakPwPrompt(true), 400); else if (um.weak_password && window.self === window.top) setTimeout(() => weakPwPrompt(false), 400);
  window.onhashchange = route;
  route();
  refreshCounters();
  clearInterval(S.poll); S.poll = setInterval(refreshCounters, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCounters(); });
}
async function logout() { await sb.auth.signOut(); clearInterval(S.poll); S.ctx = null; location.hash = ''; boot(); }

async function refreshCounters() {

async function openNotif(btn) {
  const host = btn.parentElement; const ex = $('.drop', host); if (ex) { ex.remove(); return; }
  $$('.drop').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'drop'; d.innerHTML = '<div class="spin"></div>'; host.appendChild(d);
  const close = ev => { if (!d.contains(ev.target) && !btn.contains(ev.target)) { d.remove(); document.removeEventListener('mousedown', close); } };
  setTimeout(() => document.addEventListener('mousedown', close), 0);
  const rows = await q(sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(40));
  d.innerHTML = `<div class="row" style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>การแจ้งเตือน</b><span class="grow"></span><button class="btn sm ghost" id="nall">อ่านทั้งหมด</button></div><div style="overflow:auto">${rows.length ? rows.map(n =>

/* ครอปรูปโปรไฟล์เป็นสี่เหลี่ยมจัตุรัส ให้ใบหน้าอยู่กึ่งกลางกรอบวงกลม (ลาก/ซูมได้) */
function cropPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onerror = () => rej(new Error('ไฟล์รูปไม่ถูกต้อง'));
    img.onload = () => {
      const B = 260; const base = B / Math.min(img.width, img.height); let z = 1, x = 0, y = 0;
      const m = modal({ title: 'จัดรูปให้อยู่กึ่งกลาง', body: `<div class="tiny muted" style="text-align:center">ลากรูปเพื่อเลื่อน และปรับขนาดให้ใบหน้าอยู่กลางวงกลม</div><div class="crop" id="cpb"></div><label class="f">ซูม<input type="range" id="cpz" min="1" max="4" step="0.01" value="1"></label>`,
        foot: `<button class="btn" data-c>ยกเลิก</button><button class="btn pri" data-ok>ใช้รูปนี้</button>`, onClose: () => res(null) });
      const box = $('#cpb', m.el); box.appendChild(img);
      const clamp = () => { const s = base * z, w = img.width * s, h = img.height * s; x = Math.min(0, Math.max(B - w, x)); y = Math.min(0, Math.max(B - h, y)); img.style.width = w + 'px'; img.style.height = h + 'px'; img.style.transform = `translate(${x}px,${y}px)`; };
      x = (B - img.width * base) / 2; y = (B - img.height * base) / 2; clamp();
      $('#cpz', m.el).oninput = ev => { const nz = Number(ev.target.value); const cx = (B / 2 - x) / (base * z), cy = (B / 2 - y) / (base * z); z = nz; x = B / 2 - cx * base * z; y = B / 2 - cy * base * z; clamp(); };
      let drag = null;
      box.onpointerdown = ev => { drag = { px: ev.clientX, py: ev.clientY, x, y }; box.setPointerCapture(ev.pointerId); };
      box.onpointermove = ev => { if (!drag) return; x = drag.x + ev.clientX - drag.px; y = drag.y + ev.clientY - drag.py; clamp(); };
      box.onpointerup = box.onpointercancel = () => { drag = null; };
      $('[data-c]', m.el).onclick = () => m.close();
      $('[data-ok]', m.el).onclick = () => {
        const O = 480, s = base * z, c = document.createElement('canvas'); c.width = c.height = O;
        c.getContext('2d').drawImage(img, -x / s, -y / s, B / s, B / s, 0, 0, O, O);
        c.toBlob(b => { m.el.remove(); res(new File([b], 'photo.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', .88);
      };
    };
    img.src = URL.createObjectURL(file);
  });
}
function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(new File([b], 'photo.jpg', { type: 'image/jpeg' })), 'image/jpeg', .85);
    }; img.onerror = () => rej(new Error('ไฟล์รูปไม่ถูกต้อง')); img.src = URL.createObjectURL(file);
  });
}

/* ===================== HR AGENT — ตรวจเวลาเข้างานจากเครื่องสแกน แล้วชมเชย/เตือน =====================
   ใช้ข้อมูลจริงจาก attendance_daily_summaries เท่านั้น — ถ้ายังไม่มีกะ (OI-05) จะไม่ตัดสินว่าสาย/ตรงเวลา */
async function hrAgentData() {
  const e = me(); const t = todayStr(); const p = dParts(t);
  const from = `${p.y}-${String(p.m).padStart(2, '0')}-01`;
  if (e.is_system) return { sys: true };
  const rows = await q(sb.from('attendance_daily_summaries').select('work_date,first_in,last_out,scheduled_start,late_minutes,attendance_status,leave_type_code').eq('employee_id', e.id).gte('work_date', from).lte('work_date', t).order('work_date'));
  const today = rows.find(r => r.work_date === t) || null;
  const late = rows.filter(r => (r.late_minutes || 0) > 0);
  const judged = rows.filter(r => r.first_in && r.scheduled_start);
  let streak = 0; for (let i = judged.length - 1; i >= 0; i--) { if ((judged[i].late_minutes || 0) > 0) break; streak++; }
  return { today, rows, late, lateMin: late.reduce((a, r) => a + (r.late_minutes || 0), 0), onTime: judged.length - late.length, streak };
}
function hrAgentVerdict(a) {
  if (a.sys) return { k: '', h: 'HR Agent', d: 'บัญชีระบบไม่มีข้อมูลเวลาเข้างาน' };
  const td = a.today;
  if (td && td.leave_type_code) return { k: '', h: 'วันนี้คุณลางาน', d: 'ขอให้พักผ่อนให้เต็มที่ แล้วพบกันวันทำงานถัดไปครับ' };
  if (td && ['HOLIDAY', 'DAY_OFF'].includes(td.attendance_status)) return { k: '', h: 'วันนี้เป็นวันหยุดของคุณ', d: 'พักผ่อนให้สบายครับ' };
  if (!td || !td.first_in) return { k: '', h: 'ยังไม่พบการสแกนเข้างานวันนี้', d: 'HR Agent จะตรวจสอบให้อัตโนมัติเมื่อข้อมูลจากเครื่องสแกนใบหน้าเข้ามา' };
  if (!td.scheduled_start) return { k: '', h: `บันทึกเข้างานแล้ว ${fT(td.first_in)} น.`, d: 'ยังไม่ได้กำหนดกะการทำงาน จึงยังตรวจการมาสาย/ตรงเวลาไม่ได้ — ติดต่อ HR' };
  if ((td.late_minutes || 0) > 0) return a.late.length > 1
    ? { k: 'warn', h: 'คุณมาทำงานสายอีกแล้ว!', d: `วันนี้เข้างาน ${fT(td.first_in)} น. สาย ${num(td.late_minutes)} นาที — เดือนนี้สายแล้ว ${a.late.length} ครั้ง รวม ${num(a.lateMin)} นาที` }
    : { k: 'warn', h: 'วันนี้คุณมาสาย', d: `เข้างาน ${fT(td.first_in)} น. สาย ${num(td.late_minutes)} นาที — พรุ่งนี้มาให้ตรงเวลานะครับ` };
  return { k: 'good', h: 'เยี่ยมมาก! วันนี้มาทำงานตรงเวลา', d: `เข้างาน ${fT(td.first_in)} น.${a.streak > 1 ? ` · ตรงเวลาต่อเนื่อง ${a.streak} วันทำงานแล้ว ขอบคุณที่เป็นแบบอย่างที่ดีครับ` : ' ขอบคุณที่ตรงต่อเวลาครับ'}` };
}
async function hrAgentCard(host) {
  const a = await hrAgentData(); const v = hrAgentVerdict(a);
  host.innerHTML = `<div class="agent ${v.k}"><span class="ab">${ic(v.k === 'good' ? 'star' : v.k === 'warn' ? 'alert' : 'bot')}</span><div class="grow"><div class="tiny muted">HR Agent · ตรวจเวลาเข้างาน</div><h4>${esc(v.h)}</h4><div class="ad">${esc(v.d)}</div>
   ${a.sys ? '' : `<div class="lstat"><span>ตรงเวลา <b>${num(a.onTime)}</b> วัน</span><span>มาสาย <b style="color:${a.late.length ? 'var(--bad)' : 'inherit'}">${num(a.late.length)}</b> ครั้ง</span><span>สายสะสม <b>${num(a.lateMin)}</b> นาที</span></div>
   ${a.late.length ? `<details style="margin-top:8px"><summary class="small" style="cursor:pointer;color:var(--brand)">รายละเอียดการมาสายเดือนนี้</summary><div class="small" style="margin-top:6px">${a.late.map(r => `<div class="row" style="padding:4px 0;border-top:1px solid var(--line)"><span>${fD(r.work_date)}</span><span class="grow"></span><span>เข้า ${fT(r.first_in)} น.</span><span class="badge b-warn">สาย ${num(r.late_minutes)} นาที</span></div>`).join('')}</div></details>` : ''}`}

/* ===================== ChatHR — ผู้ช่วย HR ตอบจากข้อมูลจริงของพนักงาน ===================== */
const CHAT_Q = [['มาสายกี่ครั้ง', 'late'], ['เวลาเข้างานวันนี้', 'today'], ['วันลาคงเหลือ', 'leave'], ['สถานะคำขอ', 'docs'], ['ประกาศล่าสุด', 'ann'], ['ขอลางาน', 'goleave'], ['สลิปเงินเดือน', 'slip']];
function chatIntent(t) {
  t = t.toLowerCase();
  if (/สาย|late/.test(t)) return 'late';
  if (/ลา.*(เหลือ|คงเหลือ|กี่วัน|สิทธิ)|สิทธิ.*ลา|โควตา/.test(t)) return 'leave';
  if (/ขอลา|ยื่นลา|ลางาน/.test(t)) return 'goleave';
  if (/เข้างาน|ออกงาน|สแกน|วันนี้|เวลา/.test(t)) return 'today';
  if (/คำขอ|เอกสาร|อนุมัติ|สถานะ/.test(t)) return 'docs';
  if (/ประกาศ|ข่าว/.test(t)) return 'ann';
  if (/สลิป|เงินเดือน|payslip/.test(t)) return 'slip';
  if (/สวัสดี|hello|hi\b/.test(t)) return 'hi';
  return '';
}
async function chatAnswer(k) {
  const e = me();
  if (k === 'hi') return `สวัสดีครับคุณ${e.first_name} มีอะไรให้ HR Agent ช่วยครับ เลือกคำถามด้านบนหรือพิมพ์ถามได้เลย`;
  if (k === 'late' || k === 'today') {
    const a = await hrAgentData(); if (a.sys) return 'บัญชีระบบไม่มีข้อมูลเวลาเข้างานครับ';
    if (k === 'today') { const v = hrAgentVerdict(a); const td = a.today; return `${v.h}\n${v.d}${td && td.last_out ? `\nออกงาน ${fT(td.last_out)} น.` : ''}`; }
    if (!a.rows.some(r => r.scheduled_start)) return 'เดือนนี้ยังไม่มีข้อมูลกะการทำงานของคุณ จึงยังนับการมาสายไม่ได้ครับ';
    if (!a.late.length) return `เดือนนี้คุณยังไม่เคยมาสายเลยครับ 👏 ตรงเวลาแล้ว ${a.onTime} วัน`;
    return `เดือนนี้คุณมาสาย ${a.late.length} ครั้ง รวม ${num(a.lateMin)} นาที\n` + a.late.map(r => `• ${fD(r.work_date)} เข้า ${fT(r.first_in)} น. (สาย ${num(r.late_minutes)} นาที)`).join('\n');
  }
  if (k === 'leave') { const d = await rpc('dash_stats'); const m = d.me || {}; return `วันลาคงเหลือรวมทุกประเภทปีนี้ ${num(m.leave_remaining || 0, 1)} วัน\nดูแยกตามประเภทได้ที่เมนู “วันลาคงเหลือ” ครับ`; }
  if (k === 'docs') {
    if (e.is_system) return 'บัญชีระบบไม่มีคำขอครับ';
    const r = await q(sb.from('document_requests').select('*').eq('requester_employee_id', e.id).neq('status', 'DRAFT').order('updated_at', { ascending: false }).limit(5));
    return r.length ? 'คำขอล่าสุดของคุณ\n' + r.map(d => `• ${dtName(d.document_type_id)} — ${(DOC_STATUS[d.status] || [d.status])[0]}`).join('\n') : 'คุณยังไม่มีคำขอที่ยื่นไว้ครับ';
  }
  if (k === 'ann') { const r = await q(sb.from('announcements').select('title,publish_from,active,publish_to').order('created_at', { ascending: false }).limit(5)); const l = r.filter(a => a.active && (!a.publish_to || a.publish_to >= todayStr())); return l.length ? 'ประกาศล่าสุด\n' + l.map(a => `• ${a.title}`).join('\n') : 'ตอนนี้ยังไม่มีประกาศครับ'; }
  if (k === 'goleave') { setTimeout(() => location.hash = '#/docs/new/LEAVE', 900); return 'กำลังพาไปหน้าขอลางานครับ…'; }
  if (k === 'slip') { setTimeout(() => location.hash = '#/payroll', 900); return 'กำลังพาไปหน้าสลิปเงินเดือนครับ…'; }
  return 'ขออภัยครับ ยังไม่เข้าใจคำถาม ลองถามเรื่อง การมาสาย เวลาเข้างาน วันลาคงเหลือ สถานะคำขอ ประกาศ หรือสลิปเงินเดือน';
}
PAGES.chat = async el => {
  el.innerHTML = pageHead('ChatHR', '', '', 'chat') + `<div class="chips2" id="cq">${CHAT_Q.map(([l, k]) => `<button data-k="${k}">${l}</button>`).join('')}</div>
   <div class="chatbox" id="cbx"></div>
   <form class="chatin" id="cfm"><input class="inp" id="cin" placeholder="พิมพ์คำถามถึง HR…" autocomplete="off"><button class="btn pri" aria-label="ส่ง">${ic('send')}</button></form>`;
  const bx = $('#cbx');
  const add = (who, txt) => { const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = txt; bx.appendChild(d); d.scrollIntoView({ block: 'end', behavior: 'smooth' }); return d; };
  const ask = async (label, k) => { add('me', label); const w = add('bot', '…'); try { w.textContent = await chatAnswer(k); } catch (err) { w.textContent = 'ดึงข้อมูลไม่สำเร็จ ลองใหม่อีกครั้งครับ'; } w.scrollIntoView({ block: 'end' }); };
  add('bot', `สวัสดีครับคุณ${me().first_name || ''} ผม HR Agent 🤖\nถามเรื่องเวลาเข้างาน การมาสาย วันลา คำขอ ประกาศ หรือสลิปได้เลยครับ`);
  on($('#cq'), 'click', 'button', (ev, b) => ask(b.textContent, b.dataset.k));
  $('#cfm').onsubmit = ev => { ev.preventDefault(); const t = $('#cin').value.trim(); if (!t) return; $('#cin').value = ''; ask(t, chatIntent(t)); };

const REPORT_FN = {

const isDesk = () => !isPhone();

const DCOL = ['var(--d1,#132c5e)', 'var(--d2,#c9964f)', 'var(--d3,#d6dbe3)', 'var(--d4,#ecd8b2)', 'var(--d5,#5b7bb5)', 'var(--d6,#8a6a3a)'];
function barChart(series) {
  if (!series.length) return emptyBox('ยังไม่มีข้อมูลเวลา — นำเข้าข้อมูลจากเครื่องสแกน ZKTeco', 'clock');
  const W = 640, H = 250, L = 44, B = 34, T = 24, R = 10; const mx0 = Math.max(1, ...series.map(s => Math.max(Number(s.present), Number(s.absent))));
  const step = Math.pow(10, Math.floor(Math.log10(mx0))) / 2; const mx = Math.ceil(mx0 / step) * step || 1; const ih = H - B - T; const gw = (W - L - R) / series.length; const bw = Math.min(42, gw / 3.2);
  const y = v => T + ih - (Number(v) / mx) * ih; let g = '';
  for (let i = 0; i <= 5; i++) { const v = mx * i / 5; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" class="ax">${num(v, 0)}</text>`; }
  series.forEach((s, i) => { const cx = L + gw * i + gw / 2; const x1 = cx - bw - 3, x2 = cx + 3;
    g += `<rect x="${x1}" y="${y(s.present)}" width="${bw}" height="${Math.max(0, T + ih - y(s.present))}" rx="3" style="fill:var(--bar1,#132c5e)"><title>${esc(s.label)}: เข้างาน ${s.present}</title></rect><text x="${x1 + bw / 2}" y="${y(s.present) - 6}" text-anchor="middle" class="vl">${num(s.present, 1)}</text>
      <rect x="${x2}" y="${y(s.absent)}" width="${bw}" height="${Math.max(2, T + ih - y(s.absent))}" rx="3" style="fill:var(--bar2,#c9964f)"><title>${esc(s.label)}: ขาดงาน ${s.absent}</title></rect><text x="${x2 + bw / 2}" y="${y(s.absent) - 6}" text-anchor="middle" class="vl">${num(s.absent, 1)}</text>
      <text x="${cx}" y="${H - 10}" text-anchor="middle" class="xl">${esc(s.label)}</text>`; });
  return `<div class="lgnd"><span><i style="background:var(--bar1,#132c5e)"></i>เข้างานปกติ</span><span><i style="background:var(--bar2,#c9964f)"></i>ขาดงาน</span></div><svg viewBox="0 0 ${W} ${H}" class="bchart" role="img" aria-label="สถิติการเข้างาน">${g}</svg>`;
}
function donut(items) {
  let list = items.slice(0, 3); const rest = items.slice(3).reduce((a, x) => a + Number(x.n), 0); if (rest) list.push({ name: 'อื่น ๆ', n: rest });
  const tot = list.reduce((a, x) => a + Number(x.n), 0);
  if (!tot) return `<div class="dwrap"><svg viewBox="0 0 120 120" class="donut"><circle cx="60" cy="60" r="44" fill="none" stroke="var(--line)" stroke-width="18"/><text x="60" y="62" text-anchor="middle" class="dn">0</text><text x="60" y="78" text-anchor="middle" class="ds">รายการ</text></svg><div class="muted small">ยังไม่มีการลาในเดือนนี้</div></div>`;
  let a0 = -Math.PI / 2, segs = ''; const r = 44, c = 60;
  list.forEach((x, i) => { const a = (Number(x.n) / tot) * Math.PI * 2; const a1 = a0 + a - (list.length > 1 ? 0.03 : 0); const big = a > Math.PI ? 1 : 0;
    segs += list.length === 1 ? `<circle cx="60" cy="60" r="${r}" fill="none" style="stroke:${DCOL[i]}" stroke-width="18"/>` : `<path d="M${c + r * Math.cos(a0)} ${c + r * Math.sin(a0)} A${r} ${r} 0 ${big} 1 ${c + r * Math.cos(a1)} ${c + r * Math.sin(a1)}" fill="none" style="stroke:${DCOL[i]}" stroke-width="18"><title>${esc(x.name)} ${x.n}</title></path>`; a0 += a; });
  return `<div class="dwrap"><svg viewBox="0 0 120 120" class="donut">${segs}<text x="60" y="62" text-anchor="middle" class="dn">${num(tot)}</text><text x="60" y="78" text-anchor="middle" class="ds">รายการ</text></svg>
    <div class="dleg">${list.map((x, i) => `<div><i style="background:${DCOL[i]}"></i><div><b>${esc(x.name)}</b><span>${num(x.n)} รายการ<br>(${(Number(x.n) * 100 / tot).toFixed(1)}%)</span></div></div>`).join('')}</div></div>`;
}

function parseHireDate(v) {

  const src = String(v).trim();
  if (v instanceof Date && !isNaN(v)) { let y = v.getFullYear(); if (y > 2400) y -= 543; return { d: `${y}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`, src }; }

  let m = src.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if (m) { let y = +m[3]; if (y > 2400) y -= 543; return { d: `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`, src }; }
  m = src.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) { let y = +m[1]; if (y > 2400) y -= 543; return { d: `${y}-${m[2]}-${m[3]}`, src }; }
  return { d: null, src, bad: 1 };
}

async function crudCard(host, cfg) {

  host.innerHTML = `<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">${esc(title)}</h3><span class="muted small">${rows.length} รายการ</span><span class="grow"></span>${canEdit ? `<button class="btn sm pri" data-new>${ic('plus')} เพิ่ม</button>` : ''}</div>${intro}
    ${table(rows, cols, { empty: 'ยังไม่มีข้อมูล', acts: canEdit ? (r => `<button class="btn sm ghost icon" data-ed="${r.id}" aria-label="แก้ไข">${ic('edit')}</button>${del ? `<button class="btn sm ghost icon" data-del="${r.id}" aria-label="ลบ">${ic('trash')}</button>` : ''}`) : null })}</div>`;
  const reload = async () => { await crudCard(host, cfg); after && after(); };
  const save = async (v, id) => { v = map(v); if (id) await q(sb.from(tbl).update(v).eq('id', id)); else await q(sb.from(tbl).insert(v)); await loadLookups(); toast('บันทึกแล้ว', 'good'); reload(); };
  if (!canEdit) return rows;
  $('[data-new]', host).onclick = () => formModal({ title: 'เพิ่ม' + title, fields: typeof fields === 'function' ? fields() : fields, values: cfg.defaults || {}, onSubmit: v => save(v) });
  on(host, 'click', '[data-ed]', (e, b) => { const r = rows.find(x => x.id === b.dataset.ed); formModal({ title: 'แก้ไข' + title, fields: typeof fields === 'function' ? fields(r) : fields, values: cfg.toForm ? cfg.toForm(r) : r, onSubmit: v => save(v, r.id) }); });
  on(host, 'click', '[data-del]', async (e, b) => { if (await confirmDlg('ลบรายการนี้?', { danger: true, okText: 'ลบ' })) { await guard(() => q(sb.from(tbl).delete().eq('id', b.dataset.del)), 'ลบแล้ว'); await loadLookups(); reload(); } });
  return rows;
}

/* ---------- นำเข้ายอดวันลาตั้งต้นจากระบบ HR เดิม ---------- */
const LV_OLD = { 'ลากิจ': 'PERSONAL', 'ลาไม่รับค่าจ้าง': 'UNPAID', 'ลาป่วย': 'SICK', 'ลาป่วย(มีใบรับรองแพทย์)': 'SICK', 'ลาคลอด': 'MATERNITY', 'ลาพักร้อน': 'VACATION', 'ลาอุปสมบท': 'ORDINATION', 'ลาช่วยภรรยาคลอดบุตร': 'PATERNITY', 'ขาดงาน': 'ABSENT' };
function lvCode(name) {
  const n = String(name || '').replace(/\s*\(วัน\)\s*$/, '').trim(); if (!n) return null;
  if (LV_OLD[n]) return LV_OLD[n];
  const t = S.L.leaveTypes.find(x => x.leave_name === n || n.startsWith(x.leave_name)); return t ? t.leave_code : null;
}
const lvNum = v => { const m = String(v ?? '').replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? Number(m[0]) : 0; };
const lvDate = v => { const m = String(v || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!m) return null; let y = +m[3]; if (y > 2400) y -= 543; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; };
const r2 = x => Math.round(x * 100) / 100;
function parseLeaveSummary(aoa) {
  const hi = aoa.findIndex(r => r.some(c => lvCode(c))); if (hi < 0) throw new Error('ไม่พบหัวคอลัมน์ประเภทการลาในไฟล์สถิติการลา');
  const cols = []; aoa[hi].forEach((c, i) => { const lc = lvCode(c); if (lc) cols.push({ lc, i }); });
  const out = {};
  for (const r of aoa.slice(hi + 1)) {
    const cell = r.find(c => /^\s*[A-Za-z0-9._-]+\s*:/.test(String(c ?? ''))); if (!cell) continue;
    const code = String(cell).split(':')[0].trim(), name = String(cell).split(':').slice(1).join(':').trim();
    out[code] = { name, t: {} };
    for (const { lc, i } of cols) out[code].t[lc] = { q: lvNum(r[i]), u: lvNum(r[i + 1]), rem: lvNum(r[i + 2]) };
  }
  return out;
}
function parseLeaveDetail(aoa) {
  const out = []; let cur = null;
  for (const r of aoa) {
    const c0 = String(r[0] ?? '');
    if (/^\s*[A-Za-z0-9._-]+\s*:/.test(c0) && !lvDate(r[1])) { cur = c0.split(':')[0].trim(); continue; }
    const d = lvDate(r[1]), lc = lvCode(r[3]);
    if (cur && d && lc) out.push({ code: cur, lc, d, ch: String(r[4] || '').trim(), u: lvNum(r[5]), note: String(r[6] || '').trim() || String(r[3]) });
  }
  return out;
}
async function importLeaveOpening(year) {
  const res = await formModal({ title: `นำเข้ายอดวันลาตั้งต้นปี ${year + 543} จากระบบเดิม`, okText: 'อ่านไฟล์', wide: true,
    intro: `<div class="notice info">${ic('alert')}<div>ใช้ไฟล์ส่งออกจากระบบ HR เดิม: <b>1) รายงานสถิติการลาตามโควตา</b> (จำเป็น — ใช้เป็นสิทธิและยอดคงเหลือ) และ <b>2) รายงานรายละเอียดโควตาการลา</b> (ไม่บังคับ — ใช้เป็นประวัติการลารายวัน) ระบบจะปรับยอดให้ตรงกับ “คงเหลือ” ในรายงานสถิติ และแสดงตัวอย่างก่อนบันทึก</div></div>`,
    fields: [{ k: 'a', label: 'รายงานสถิติการลาตามโควตา (.xlsx)', type: 'file', accept: '.xlsx,.xls', req: true, full: true }, { k: 'b', label: 'รายงานรายละเอียดโควตาการลา (.xlsx)', type: 'file', accept: '.xlsx,.xls', full: true }] });
  if (!res) return;
  const X = await guard(loadXLSX);
  const aoa = async f => { const wb = X.read(await f.arrayBuffer(), { type: 'array', cellDates: false, raw: false }); return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false }); };
  let sum, det = [];
  try { sum = parseLeaveSummary(await aoa(res.a[0])); if (res.b && res.b[0]) det = parseLeaveDetail(await aoa(res.b[0])); } catch (e) { toast(e.message, 'bad'); return; }
  const byCode = new Map(S.dir.map(x => [x.employee_code, x]));
  const done = new Set((await q(sb.from('leave_transactions').select('employee_id').eq('leave_year', year).like('idem_key', `IMP:${year}:%`))).map(x => x.employee_id));
  const rows = [], emps = [];
  for (const [code, s] of Object.entries(sum)) {
    const e = byCode.get(code), warn = [];
    if (!e) warn.push('ไม่พบรหัสในระบบ'); else if (done.has(e.id)) warn.push('นำเข้าแล้ว — ข้าม');
    const mine = det.filter(x => x.code === code), seq = {}; let n = 0;
    const lines = [];

      if (t.q) lines.push({ employee_code: code, leave_code: lc, kind: 'ENTITLEMENT', units: t.q, date: `${year}-01-01`, reason: `โควตาปี ${year + 543} จากระบบเดิม`, key: '' });
      const dl = mine.filter(x => x.lc === lc && x.u > 0); let used = 0;
      if (det.length) for (const x of dl) { const k = `${code}:${lc}:${x.d}`; seq[k] = (seq[k] || 0) + 1; used += r2(x.u);
        lines.push({ employee_code: code, leave_code: lc, kind: 'USAGE', units: x.u, date: x.d, reason: x.note + (x.ch && x.ch !== 'Calculation' ? ` [ระบบเดิม: ${x.ch}]` : ''), key: `${k}:${seq[k]}` }); }
      else if (t.u) { used = r2(t.u); lines.push({ employee_code: code, leave_code: lc, kind: 'USAGE', units: t.u, date: `${year}-01-01`, reason: 'ยอดใช้แล้วจากระบบเดิม', key: `${code}:${lc}:TOTAL` }); }
      const want = t.q ? r2(t.q - t.rem) : t.u, diff = r2(want - used);
      if (Math.abs(diff) >= 0.01) lines.push({ employee_code: code, leave_code: lc, kind: 'ADJUSTMENT', units: -diff, date: todayStr(), reason: 'ปรับให้ตรงยอดคงเหลือในรายงานสถิติการลาระบบเดิม', key: `${code}:${lc}:RECON` });

async function parseAttFile(file) {
  const out = []; const name = file.name.toLowerCase();
  const normTs = s => { s = String(s).trim().replace('T', ' '); let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/); if (m) { let y = +m[1]; if (y > 2400) y -= 543; return `${y}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')} ${m[4].padStart(2, '0')}:${m[5]}:${m[6] || '00'}`; }
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/); if (m) { let y = +m[3]; if (y > 2400) y -= 543; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')} ${m[4].padStart(2, '0')}:${m[5]}:${m[6] || '00'}`; } return null; };
  let rows;
  if (/\.xlsx?$/.test(name)) { const X = await loadXLSX(); const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true }); rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, dateNF: 'yyyy-mm-dd hh:mm:ss' }); }
  else { const txt = await file.text(); rows = txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.includes('\t') ? l.split('\t') : l.includes(',') ? l.split(',') : l.trim().split(/\s{2,}|\s(?=\d{4}-)/)); }
  const hdr = rows[0].map(x => String(x || '').toLowerCase());
  const iu = hdr.findIndex(h => /ac-?no|user ?id|enroll|^id$|รหัส|pin/.test(h)), it = hdr.findIndex(h => /date ?time|^time$|เวลา|checktime|punch/.test(h)), id_ = hdr.findIndex(h => /^date$|วันที่/.test(h));
  const hasHdr = iu >= 0 && (it >= 0 || id_ >= 0);
  for (const r of (hasHdr ? rows.slice(1) : rows)) {
    let u, ts, verify = '', st = '';
    if (hasHdr) { u = r[iu]; ts = it >= 0 && id_ >= 0 && it !== id_ && !/\d{4}/.test(String(r[it])) ? `${r[id_]} ${r[it]}` : r[it >= 0 ? it : id_]; }
    else { const line = r.join(' ').trim(); const m = line.match(/^(\S+)\s+(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}[ T]\d{1,2}:\d{2}(?::\d{2})?)\s*(\S*)\s*(\S*)/); if (!m) continue; u = m[1]; ts = m[2]; verify = m[3]; st = m[4]; }
    const n = normTs(ts); if (!u || !n) continue;
    out.push({ user_id: String(u).trim(), ts: n, verify, punch_type: st });
  }
  return out;
}
