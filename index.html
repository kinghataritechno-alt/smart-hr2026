        onSubmit: async v => { if (v.resolver === 'EMPLOYEE' && !v.approver_employee_id) throw new Error('กรุณาระบุผู้อนุมัติ'); await q(sb.from('approval_workflow_steps').update(v).eq('id', s.id)); const w = wf.find(x => x.id === s.workflow_id); await q(sb.from('approval_workflows').update({ version: w.version + 1, updated_at: new Date().toISOString() }).eq('id', w.id)); toast('บันทึกแล้ว', 'good'); SET.workflow(b); } }); });
    if ($('#wfall')) $('#wfall').onclick = () => formModal({ title: 'ผู้มีอำนาจอนุมัติ (ขั้นที่ 3) — ทุกประเภทเอกสาร', fields: [{ k: 'a', label: 'ผู้อนุมัติ', type: 'emp', req: true, activeOnly: true }, { k: 'bk', label: 'ผู้อนุมัติสำรอง', type: 'emp', activeOnly: true }],
      onSubmit: async v => { for (const s of steps.filter(x => x.step_order === 3)) await q(sb.from('approval_workflow_steps').update({ resolver: 'EMPLOYEE', approver_employee_id: v.a, backup_employee_id: v.bk }).eq('id', s.id)); for (const w of wf) await q(sb.from('approval_workflows').update({ version: w.version + 1 }).eq('id', w.id)); toast('บันทึกแล้ว', 'good'); SET.workflow(b); } });
  },
  async users(b) {
    const acc = await rpc('hr_accounts'); const am = Object.fromEntries((acc || []).map(a => [a.employee_id, a]));
    const list = [...S.dir, ...(me().is_system ? [Object.assign({}, me(), { id: me().id })] : [])];
    b.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="row"><div class="search" style="max-width:none;flex:2"><input class="inp" id="uq" placeholder="ค้นหา">${ic('search')}</div>
      <select class="inp" id="uf" style="width:auto;flex:1"><option value="">ทั้งหมด</option><option value="none">ยังไม่มีบัญชี</option><option value="has">มีบัญชี</option><option value="off">ถูกระงับ</option>${Object.entries(ROLE_NAMES).map(([k, v]) => `<option value="r:${k}">${v}</option>`).join('')}</select>
      ${can.hrAdmin() ? `<button class="btn pri" id="ubulk">${ic('key')} สร้างบัญชีให้ที่เลือก</button>` : ''}</div></div><div id="ulist"></div>`;
    let rows = [];
    const draw = () => { const t = $('#uq').value.trim().toLowerCase(), f = $('#uf').value;
      rows = list.filter(x => (!t || `${x.employee_code} ${x.first_name} ${x.last_name || ''}`.toLowerCase().includes(t)) && (!f || (f === 'none' ? !am[x.id]?.user_id : f === 'has' ? am[x.id]?.user_id : f === 'off' ? am[x.id] && am[x.id].user_id && !am[x.id].active : (am[x.id]?.roles || []).includes(f.slice(2)))));
      $('#ulist').innerHTML = `<div class="small muted" style="margin-bottom:6px">${rows.length} คน · มีบัญชี ${(acc || []).filter(a => a.user_id).length} คน</div>` + table(rows.slice(0, 400), [{ label: '<input type="checkbox" id="uall">'.replace(/</g, '<'), fmt: x => !am[x.id]?.user_id && can.hrAdmin() && ['ACTIVE', 'PROBATION'].includes(x.employee_status) ? `<input type="checkbox" class="usel" value="${x.id}">` : '' },
        { label: 'ชื่อผู้ใช้', fmt: x => `<span class="mono">${esc(x.employee_code)}</span>` }, { label: 'ชื่อ', fmt: x => esc(`${x.first_name} ${x.last_name || ''}`) }, { label: 'สถานะพนักงาน', fmt: x => badge(EMP_STATUS, x.employee_status) },
        { label: 'บัญชี', fmt: x => !am[x.id]?.user_id ? '<span class="badge">ยังไม่มี</span>' : am[x.id].active ? '<span class="badge b-good">ใช้งาน</span>' : '<span class="badge b-bad">ระงับ</span>' }, { label: 'สิทธิ์', fmt: x => (am[x.id]?.roles || []).map(r => `<span class="badge b-info">${esc(ROLE_NAMES[r] || r)}</span>`).join(' ') }, { label: 'เข้าระบบล่าสุด', fmt: x => am[x.id]?.last_sign_in_at ? fDT(am[x.id].last_sign_in_at) : '–' }],
        { acts: can.hrAdmin() ? (x => am[x.id]?.user_id ? `<button class="btn sm" data-ro="${x.id}">${ic('shield')}</button><button class="btn sm" data-pw="${x.id}">${ic('key')}</button>` : `<button class="btn sm" data-cr="${x.id}">สร้าง</button>`) : null });
      const th = $('#ulist th'); if (th) th.innerHTML = can.hrAdmin() ? '<input type="checkbox" id="uall" aria-label="เลือกทั้งหมด">' : '';
      if ($('#uall')) $('#uall').onchange = e => $$('.usel').forEach(c => c.checked = e.target.checked);
    };
    $('#uq').oninput = debounce(draw, 150); $('#uf').onchange = draw; draw();
    on(b, 'click', '[data-cr]', (e, bt) => accountCreate([bt.dataset.cr]));
    on(b, 'click', '[data-ro]', async (e, bt) => { const a = am[bt.dataset.ro]; if (await editRoles(a.user_id, a.roles || [])) SET.users(b); });
    on(b, 'click', '[data-pw]', (e, bt) => formModal({ title: 'รีเซ็ตรหัสผ่าน ' + (S.dirMap[bt.dataset.pw] || me()).employee_code, intro: `<div class="notice info">${ic('key')}<div>เว้นว่าง = กลับเป็นรหัสพนักงาน และให้พนักงานตั้งรหัสผ่านใหม่เมื่อเข้าสู่ระบบ</div></div>`, fields: [{ k: 'p', label: 'รหัสผ่านใหม่ (อย่างน้อย 8 ตัว หรือเว้นว่าง)', full: true }], onSubmit: async v => { await rpc('hr_reset_password', { p_emp: bt.dataset.pw, p_password: v.p || '' }); toast('รีเซ็ตแล้ว', 'good'); } }));
    if ($('#ubulk')) $('#ubulk').onclick = () => { const ids = $$('.usel:checked').map(c => c.value); if (!ids.length) return toast('เลือกพนักงานอย่างน้อย 1 คน (ช่องติ๊กด้านซ้าย)', 'bad'); accountCreate(ids); };
  },
  async payitems(b) {
    await crudCard(b, { title: 'รายการรายได้/รายการหัก', tbl: 'payroll_item_types', order: 'sort', canEdit: can.hrAdmin() || can.payAdmin(),
      intro: `<div class="tiny muted" style="margin-bottom:8px">“ฐานประกันสังคม” และ “เงินได้พึงประเมิน” กำหนดว่ารายการใดนำไปคิดประกันสังคม/ภาษี — ${pend('OI-08 รอยืนยัน')}</div>`,
      cols: [{ label: 'รหัส', fmt: r => `<span class="mono">${esc(r.item_code)}</span>` }, { label: 'ชื่อ', k: 'item_name' }, { label: 'ประเภท', fmt: r => r.item_type === 'EARNING' ? '<span class="badge b-good">รายได้</span>' : '<span class="badge b-bad">รายการหัก</span>' }, { label: 'เงินได้พึงประเมิน', fmt: r => r.taxable_status ? 'ใช่' : '–' }, { label: 'ฐานประกันสังคม', fmt: r => r.social_security_status ? 'ใช่' : '–' }, { label: 'วิธีคำนวณ', k: 'calculation_method' }, { label: 'สถานะ', fmt: r => stBadge(r.active_status) }],
      fields: r => [{ k: 'item_code', label: 'รหัส', req: true, ro: r && r.is_system }, { k: 'item_name', label: 'ชื่อ', req: true }, { k: 'item_type', label: 'ประเภท', type: 'select', req: true, noEmpty: true, opts: [['EARNING', 'รายได้'], ['DEDUCTION', 'รายการหัก']], ro: r && r.is_system }, { k: 'calculation_method', label: 'วิธีคำนวณ', type: 'select', req: true, noEmpty: true, opts: [['MANUAL', 'กรอกเอง (Adjustment)'], ['FIXED', 'รายการคงที่รายเดือน'], ['SALARY', 'เงินเดือน'], ['OT', 'OT'], ['SSO', 'ประกันสังคม'], ['LEAVE', 'หักวันลา']], ro: r && r.is_system }, { k: 'taxable_status', label: 'นำไปคิดเงินได้พึงประเมิน', type: 'check' }, { k: 'social_security_status', label: 'นำไปคิดฐานประกันสังคม', type: 'check' }, { k: 'sort', label: 'ลำดับ', type: 'number' }, { k: 'active_status', label: 'สถานะ', type: 'select', opts: ST_OPTS, def: 'ACTIVE', noEmpty: true, req: true }] });
  },
  async audit(b) {
    if (!can.hrAdmin()) { b.innerHTML = emptyBox('เฉพาะ HR Admin', 'lock'); return; }
    b.innerHTML = `<div class="row" style="margin-bottom:10px"><select class="inp" id="aue" style="width:auto"><option value="">ทุกตาราง</option>${['employees', 'employee_sensitive', 'employee_assignments', 'salary_histories', 'user_roles', 'system_settings', 'approval_workflow_steps', 'payroll_runs', 'leave_transactions', 'attendance_adjustments', 'work_schedules', 'device_employee_mappings', 'auth.users'].map(x => `<option>${x}</option>`).join('')}</select><button class="btn" id="aux">${ic('download')} ส่งออก</button></div><div id="aul"></div>`;
    let rows = [];
    const draw = async () => { let qq = sb.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(300); if ($('#aue').value) qq = qq.eq('entity', $('#aue').value); rows = await q(qq);
      $('#aul').innerHTML = table(rows, [{ label: 'เวลา', fmt: r => fDT(r.created_at) }, { label: 'ผู้ดำเนินการ', fmt: r => r.actor_employee_id ? esc(empName(r.actor_employee_id, true)) : 'ระบบ' }, { label: 'การกระทำ', k: 'action' }, { label: 'ตาราง', fmt: r => `<span class="mono small">${esc(r.entity)}</span>` }, { label: 'อ้างอิง', fmt: r => `<span class="mono tiny">${esc(String(r.entity_id || '').slice(0, 8))}</span>` + (S.dirMap[r.entity_id] ? ' ' + esc(empName(r.entity_id)) : '') }]); };
    $('#aue').onchange = draw; $('#aux').onclick = () => exportCSV(rows.map(r => ({ time: r.created_at, actor: empName(r.actor_employee_id, true), action: r.action, entity: r.entity, entity_id: r.entity_id })), 'audit_' + todayStr()); draw();
  }
};

boot();
</script>
</body>
</html>
